<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Clipboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #1e1e1e; color: #d4d4d4; font-family: system-ui, sans-serif; display: flex; flex-direction: column; }
        header { padding: 15px 20px; background-color: #2d2d2d; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        h1 { margin: 0; font-size: 1.2rem; color: #fff; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        
        #status { display: flex; align-items: center; gap: 8px; margin-right: 10px; }
        .indicator { width: 10px; height: 10px; border-radius: 50%; background-color: #f44336; }
        .indicator.online { background-color: #4caf50; }
        
        button.btn-main { background: #4caf50; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        button.btn-main:hover { filter: brightness(1.1); }
        button.btn-icon { background: #3d3d3d; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 1.1rem; }
        button.btn-icon:hover { background: #555; }
        
        .tabs-container { display: flex; background-color: #252525; border-bottom: 1px solid #3d3d3d; padding: 0 10px; overflow-x: auto; }
        .tabs-container::-webkit-scrollbar { height: 4px; }
        .tabs-container::-webkit-scrollbar-thumb { background: #4a4a4a; }
        .tab { padding: 12px 20px; cursor: pointer; border-bottom: 2px solid transparent; color: #a0a0a0; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        .tab:hover { color: #fff; }
        .tab.active { border-bottom: 2px solid #4caf50; background-color: #000000; color: #d4d4d4; }
        .tab-delete { font-size: 1.3rem; line-height: 1; padding: 0 4px; border-radius: 50%; display: none; }
        .tab.active .tab-delete { display: inline-block; color: #888; }
        .tab-delete:hover { color: #ff5555 !important; }
        .add-tab-btn { background: transparent; color: #a0a0a0; font-size: 1.5rem; padding: 5px 15px; border: none; cursor: pointer; }
        
        .editor { flex: 1; width: 100%; box-sizing: border-box; background-color: #ffffff; color: #000000; border: none; padding: 20px; font-size: 1.1rem; outline: none; overflow-y: auto; filter: invert(1) hue-rotate(180deg); }
        .editor[empty]:before { content: attr(placeholder); color: #888; pointer-events: none; display: block; }
        .editor table { border-collapse: collapse; }
        .editor td, .editor th { border: 1px solid #ccc; padding: 4px 8px; }
        .editor img { max-width: 100%; height: auto; filter: invert(1) hue-rotate(180deg); border-radius: 4px; }
        .editor a { color: #2196f3; text-decoration: underline; font-weight: bold; }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: #2d2d2d; padding: 25px; border-radius: 8px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal h2 { margin-top: 0; }
        .device-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #1e1e1e; margin-bottom: 8px; border-radius: 4px; font-size: 0.95rem; }
        .btn-danger { background: #f44336 !important; }
    </style>
</head>
<body>

    <header>
        <h1>Live Clipboard</h1>
        <div class="header-right">
            <!-- Admin Dashboard Button with Notification Badge -->
            <button class="btn-icon" id="devices-btn" title="Admin Dashboard" style="display:none; position:relative;">
                💻
                <span id="req-badge" style="display:none; position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; width:18px; height:18px; font-size:11px; line-height:18px; text-align:center; font-weight:bold;">1</span>
            </button>
            <button class="btn-main" id="copy-btn" style="display:none;">Copy</button>
            <button class="btn-main btn-danger" id="lock-btn" style="display:none;">Lock</button>
            <div id="status"><div id="indicator" class="indicator"></div></div>
        </div>
    </header>

    <!-- UNLOCKED VIEW -->
    <div id="unlocked-view" style="display:none; flex-direction: column; flex: 1;">
        <div class="tabs-container" id="tabs-container"></div>
        <div id="clipboard" class="editor" contenteditable="true" placeholder="Paste text or images here..."></div>
    </div>

    <!-- LOCKED VIEW -->
    <div id="locked-view" style="display:flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" style="width: 64px; height: 64px; margin-bottom: 10px;">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <h2 style="margin-top:0;">Clipboard Locked</h2>
        
        <div style="background: #252525; padding: 25px; border-radius: 8px; margin: 20px 0; border: 1px solid #333; width: 300px;">
            <p style="color: #a0a0a0; margin-top: 0; font-weight: bold;">Admin Login</p>
            <div style="display: flex; gap: 5px; justify-content: center;">
                <input type="password" id="main-pin-input" placeholder="Secret PIN" style="padding: 12px; font-size: 1.2rem; border-radius: 4px; border: 1px solid #555; background: #1e1e1e; color: #fff; text-align: center; width: 60%; outline: none;">
                <button class="btn-main" id="admin-login-btn" style="padding: 12px;">Unlock</button>
            </div>
            <label style="font-size: 0.9rem; color: #a0a0a0; margin-top: 15px; display: inline-block; cursor: pointer;">
                <input type="checkbox" id="main-remember-me"> Keep me logged in
            </label>
        </div>

        <p style="color: #666; font-weight: bold;">— OR —</p>

        <div style="background: #2d2d2d; padding: 25px; border-radius: 8px; margin-top: 10px; border: 1px solid #444; width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <p style="margin-top: 0; color: #a0a0a0; font-weight: bold;">Public Access</p>
            <h3 style="color: #4caf50; margin: 10px 0; letter-spacing: 2px;">ID: <span id="public-device-id">---</span></h3>
            <button class="btn-main" id="request-access-btn" style="background: #2196f3; width: 100%; margin-top: 10px;">🔔 Request Access</button>
            <p id="request-status" style="display:none; color:#ff9800; font-size:0.9rem; margin-top:15px; line-height: 1.4;"></p>
        </div>
    </div>

    <!-- ADMIN DASHBOARD MODAL -->
    <div class="modal-overlay" id="devices-modal">
        <div class="modal">
            <h2 style="margin-bottom: 25px;">Admin Dashboard</h2>
            
            <div id="pending-requests-container" style="display:none; margin-bottom: 25px; text-align:left;">
                <h3 style="color:#ff9800; border-bottom: 1px solid #444; padding-bottom:5px; margin-top: 0;">🔔 Pending Requests</h3>
                <div id="pending-list"></div>
            </div>

            <div style="text-align:left;">
                <h3 style="color:#4caf50; border-bottom: 1px solid #444; padding-bottom:5px; margin-top: 0;">💻 Active Systems</h3>
                <div id="devices-list" style="max-height: 200px; overflow-y: auto;"></div>
            </div>
            
            <button class="btn-main" style="margin-top: 25px; width: 100%;" onclick="document.getElementById('devices-modal').classList.remove('active')">Close Dashboard</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref as dbRef, onValue, set, remove, push, onDisconnect, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBJ9y1yA231l5DBpHdQJUsxdkYHlM_lPE",
            authDomain: "my-clipboard-b96fc.firebaseapp.com",
            databaseURL: "https://my-clipboard-b96fc-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "my-clipboard-b96fc"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let myDeviceId = localStorage.getItem('clip_device_id');
        if (!myDeviceId) { myDeviceId = Math.random().toString(36).substr(2, 6).toUpperCase(); localStorage.setItem('clip_device_id', myDeviceId); }

        const editor = document.getElementById('clipboard');
        const mainPinInput = document.getElementById('main-pin-input');
        const rememberCheckbox = document.getElementById('main-remember-me');
        const myDeviceRef = dbRef(db, `clipboard/active-devices/${myDeviceId}`);
        
        let currentPin = localStorage.getItem('clip_pin') || sessionStorage.getItem('clip_pin') || "";
        let isLocalChange = false;
        let activeTabId = localStorage.getItem('activeTabId') || null;
        let unsubContent = null;
        let tabsData = {};
        let rawContentSnapshot = "";

        // --- UI STATE SWITCHING ---
        function updateUIState() {
            if (currentPin) {
                document.getElementById('locked-view').style.display = 'none';
                document.getElementById('unlocked-view').style.display = 'flex';
                document.getElementById('devices-btn').style.display = 'block';
                document.getElementById('copy-btn').style.display = 'block';
                document.getElementById('lock-btn').style.display = 'block';
                document.getElementById('public-device-id').innerText = myDeviceId;
            } else {
                document.getElementById('locked-view').style.display = 'flex';
                document.getElementById('unlocked-view').style.display = 'none';
                document.getElementById('devices-btn').style.display = 'none';
                document.getElementById('copy-btn').style.display = 'none';
                document.getElementById('lock-btn').style.display = 'none';
                document.getElementById('public-device-id').innerText = myDeviceId;
            }
        }

        // --- AUTH & PERSISTENCE ---
        rememberCheckbox.checked = localStorage.getItem('clip_remember') === 'true';
        rememberCheckbox.addEventListener('change', (e) => { localStorage.setItem('clip_remember', e.target.checked); });

        function savePin(pin, forceSession = false) {
            currentPin = pin;
            if (!pin) { 
                localStorage.removeItem('clip_pin'); sessionStorage.removeItem('clip_pin'); 
                mainPinInput.value = "";
            } else {
                if (rememberCheckbox.checked && !forceSession) {
                    localStorage.setItem('clip_pin', pin); sessionStorage.removeItem('clip_pin');
                } else {
                    sessionStorage.setItem('clip_pin', pin); localStorage.removeItem('clip_pin');
                }
            }
            updateUIState(); updatePresence();
            if (pin) { renderTabs(); decryptAndDisplayContent(rawContentSnapshot); }
        }

        document.getElementById('admin-login-btn').onclick = () => savePin(mainPinInput.value);
        mainPinInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') savePin(e.target.value);
        });
        document.getElementById('lock-btn').onclick = () => { savePin(""); editor.innerHTML = ""; tabsData = {}; };

        function getDeviceName() {
            const ua = navigator.userAgent;
            if (ua.includes("Windows")) return "Windows PC";
            if (ua.includes("Mac")) return "Mac";
            if (ua.includes("iPhone")) return "iPhone";
            if (ua.includes("Android")) return "Android";
            return "Unknown Browser";
        }

        async function getDetailedDeviceFingerprint() {
            let tz = "Unknown", gpu = "Unknown", ipData = { ip: "Unknown", city: "Unknown", org: "Unknown" };
            let batteryInfo = "Unknown", networkInfo = "Unknown", mediaInfo = "Unknown";
            
            try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) {}
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                }
            } catch(e) {}

            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                if (data.ip) ipData = { ip: data.ip, city: `${data.city}, ${data.country_name}`, org: data.org };
            } catch(e) {}

            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    batteryInfo = `${Math.round(battery.level * 100)}% ${battery.charging ? '⚡' : '🔋'}`;
                }
            } catch(e) {}

            try {
                if (navigator.connection) {
                    networkInfo = `${navigator.connection.effectiveType.toUpperCase()} (~${navigator.connection.downlink}Mbps, ${navigator.connection.rtt}ms ping)`;
                }
            } catch(e) {}

            try {
                if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const cameras = devices.filter(d => d.kind === 'videoinput').length;
                    const mics = devices.filter(d => d.kind === 'audioinput').length;
                    mediaInfo = `${cameras} Cam, ${mics} Mic`;
                }
            } catch(e) {}

            const isTouch = navigator.maxTouchPoints > 0 ? "Touch 👆" : "Mouse 🖱️";
            const theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? "Dark 🌙" : "Light ☀️";

            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform || "Unknown",
                language: navigator.language || "Unknown",
                screen: `${window.screen.width}x${window.screen.height}`,
                timezone: tz,
                cores: navigator.hardwareConcurrency || "?",
                ram: navigator.deviceMemory || "?",
                gpu: gpu,
                ip: ipData.ip,
                location: ipData.city,
                isp: ipData.org,
                battery: batteryInfo,
                network: networkInfo,
                media: mediaInfo,
                input: isTouch,
                theme: theme
            };
        }

        async function updatePresence() {
            if (currentPin) {
                const details = await getDetailedDeviceFingerprint();
                set(myDeviceRef, { name: getDeviceName(), details: details, time: Date.now() });
                onDisconnect(myDeviceRef).remove();
            } else { remove(myDeviceRef); }
        }

        onValue(myDeviceRef, (snap) => {
            if (!snap.exists() && currentPin) {
                savePin(""); document.body.innerHTML = "<h1 style='text-align:center; margin-top:20%; color:#f44336;'>Access Revoked by Admin.</h1>";
                setTimeout(() => window.location.reload(), 2000);
            }
        });

        // --- PUBLIC ACCESS REQUESTS (Guest Side) ---
        document.getElementById('request-access-btn').onclick = async () => {
            const btn = document.getElementById('request-access-btn');
            const statusEl = document.getElementById('request-status');
            
            btn.style.display = 'none';
            statusEl.style.display = 'block';
            statusEl.innerText = "⏳ Gathering secure connection details...";
            
            const details = await getDetailedDeviceFingerprint();
            const myReqRef = dbRef(db, `clipboard/access-requests/${myDeviceId}`);
            
            set(myReqRef, { name: getDeviceName(), details: details, status: 'pending', time: Date.now() });
            onDisconnect(myReqRef).remove();
            
            statusEl.innerText = "⏳ Request sent. Waiting for Admin to approve via Dashboard...";
            
            onValue(myReqRef, (snap) => {
                const data = snap.val();
                if (data && data.pin) {
                    rememberCheckbox.checked = false; // Force session storage for remote access
                    savePin(data.pin, true);
                    remove(myReqRef); 
                } else if (!data && statusEl.innerText.includes("Waiting")) {
                    statusEl.innerText = "❌ Request Denied.";
                    statusEl.style.color = "#f44336";
                    setTimeout(() => {
                        btn.style.display = 'block';
                        statusEl.style.display = 'none';
                        statusEl.style.color = "#ff9800";
                    }, 3000);
                }
            });
        };

        // --- ADMIN DASHBOARD (Approve & Revoke) ---
        document.getElementById('devices-btn').onclick = () => { document.getElementById('devices-modal').classList.add('active'); };

        // Listen for Pending Requests
        const globalReqRef = dbRef(db, 'clipboard/access-requests');
        onValue(globalReqRef, (snap) => {
            if (!currentPin) return; // Only logged in admins process requests
            
            const reqs = snap.val() || {};
            const pendingCount = Object.keys(reqs).length;
            
            const badge = document.getElementById('req-badge');
            if (pendingCount > 0) {
                badge.style.display = 'block';
                badge.innerText = pendingCount;
                document.getElementById('pending-requests-container').style.display = 'block';
            } else {
                badge.style.display = 'none';
                document.getElementById('pending-requests-container').style.display = 'none';
            }
            
            const pList = document.getElementById('pending-list');
            pList.innerHTML = "";
            Object.entries(reqs).forEach(([id, data]) => {
                if (data.status === 'pending') {
                    const div = document.createElement('div');
                    div.className = "device-item";
                    div.style.flexDirection = "column";
                    div.style.alignItems = "flex-start";
                    
                    let detailsHTML = "";
                    if (data.details) {
                        detailsHTML = `
                            <div style="font-size: 0.75rem; color: #999; margin-top: 10px; background: #151515; padding: 10px; border-radius: 4px; width: 100%; box-sizing: border-box; font-family: monospace; word-break: break-word;">
                                <div style="color: #4caf50; margin-bottom: 5px; font-size: 0.85rem;">🌍 <b>${data.details.ip}</b> — ${data.details.location}</div>
                                <div style="margin-bottom: 4px;"><b>Net & ISP:</b> ${data.details.network} | ${data.details.isp}</div>
                                <div style="margin-bottom: 4px;"><b>Hardware:</b> ${data.details.cores} Cores, ~${data.details.ram}GB RAM, ${data.details.screen}</div>
                                <div style="margin-bottom: 4px;"><b>GPU & Media:</b> ${data.details.gpu} | ${data.details.media}</div>
                                <div style="margin-bottom: 4px; color: #ff9800;"><b>Status:</b> Battery: ${data.details.battery} | ${data.details.input} | ${data.details.theme}</div>
                                <div style="margin-bottom: 4px;"><b>System:</b> ${data.details.platform} | ${data.details.timezone} | ${data.details.language}</div>
                                <div style="color:#666; font-size:0.65rem; margin-top: 8px;">${data.details.userAgent}</div>
                            </div>
                        `;
                    }

                    div.innerHTML = `
                        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
                            <div style="text-align:left;">
                                <strong>${data.name}</strong><br>
                                <small style="color:#888;">Request ID: ${id}</small>
                            </div>
                            <div style="display: flex; gap: 5px;">
                                <button class="btn-main approve-btn" data-id="${id}">Approve</button>
                                <button class="btn-main btn-danger reject-btn" data-id="${id}">Reject</button>
                            </div>
                        </div>
                        ${detailsHTML}
                    `;
                    pList.appendChild(div);
                }
            });
            
            // Attach event listeners for dynamically created buttons
            document.querySelectorAll('.approve-btn').forEach(btn => {
                btn.onclick = (e) => update(dbRef(db, `clipboard/access-requests/${e.target.dataset.id}`), { pin: currentPin });
            });
            document.querySelectorAll('.reject-btn').forEach(btn => {
                btn.onclick = (e) => remove(dbRef(db, `clipboard/access-requests/${e.target.dataset.id}`));
            });
        });

        // Listen for Active Systems (Revocation)
        onValue(dbRef(db, 'clipboard/active-devices'), (snap) => {
            if (!currentPin) return;
            const list = document.getElementById('devices-list'); list.innerHTML = "";
            const devices = snap.val() || {};
            Object.entries(devices).forEach(([id, data]) => {
                const div = document.createElement('div'); 
                div.className = "device-item";
                div.style.flexDirection = "column";
                div.style.alignItems = "flex-start";
                
                let detailsHTML = "";
                if (data.details) {
                    detailsHTML = `
                        <div style="font-size: 0.75rem; color: #777; margin-top: 5px; width: 100%; box-sizing: border-box; word-break: break-word;">
                            ${data.details.platform} • ${data.details.screen} • ${data.details.battery} • ${data.details.timezone}
                        </div>
                    `;
                }

                div.innerHTML = `
                    <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
                        <div style="text-align:left;">
                            <strong>${data.name}</strong> ${id === myDeviceId ? '<span style="color:#4caf50; font-size:0.8rem;">(This Device)</span>' : ''}<br>
                            <small style="color:#888;">ID: ${id}</small>
                        </div>
                        ${id !== myDeviceId ? `<button class="btn-main btn-danger revoke-btn" data-id="${id}">Revoke Access</button>` : ''}
                    </div>
                    ${detailsHTML}
                `;
                list.appendChild(div);
            });
            
            document.querySelectorAll('.revoke-btn').forEach(btn => {
                btn.onclick = (e) => remove(dbRef(db, `clipboard/active-devices/${e.target.dataset.id}`));
            });
        });

        // --- ENCRYPTION & TABS ---
        function encryptText(text) {
            if (!currentPin) return text;
            try { return "ENC:" + CryptoJS.AES.encrypt(text, currentPin).toString(); } catch(e) { return text; }
        }
        function decryptText(text) {
            if (!text || typeof text !== 'string' || !text.startsWith("ENC:")) return text;
            if (!currentPin) return "🔒 [Encrypted]";
            try { return CryptoJS.AES.decrypt(text.slice(4), currentPin).toString(CryptoJS.enc.Utf8) || "🔒 [Wrong PIN]"; } catch (e) { return "🔒 [Wrong PIN]"; }
        }

        onValue(dbRef(db, '.info/connected'), (snap) => {
            if (snap.val() === true) document.getElementById('indicator').classList.add('online');
            else document.getElementById('indicator').classList.remove('online');
        });

        onValue(dbRef(db, 'clipboard/tabs-meta'), (snapshot) => {
            tabsData = snapshot.val() || {};
            if (Object.keys(tabsData).length === 0 && currentPin) { set(dbRef(db, `clipboard/tabs-meta/tab_default`), { name: encryptText("Main") }); return; }
            if (!activeTabId || !tabsData[activeTabId]) activeTabId = Object.keys(tabsData)[0];
            if (currentPin) { renderTabs(); subscribeToActiveTab(); }
        });

        function renderTabs() {
            const container = document.getElementById('tabs-container'); container.innerHTML = '';
            Object.entries(tabsData).forEach(([id, meta]) => {
                const tabEl = document.createElement('div'); tabEl.className = `tab ${id === activeTabId ? 'active' : ''}`;
                const decryptedName = decryptText(meta.name);
                const nameSpan = document.createElement('span'); nameSpan.innerText = decryptedName;
                nameSpan.ondblclick = (e) => {
                    e.stopPropagation(); if (decryptedName.startsWith("🔒")) return;
                    const newName = prompt("New tab name:", decryptedName);
                    if (newName) set(dbRef(db, `clipboard/tabs-meta/${id}/name`), encryptText(newName.trim()));
                };
                const delBtn = document.createElement('span'); delBtn.className = 'tab-delete'; delBtn.innerHTML = '&times;';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (Object.keys(tabsData).length === 1) return alert("Cannot delete last tab.");
                    if (confirm(`Delete tab "${decryptedName}"?`)) { remove(dbRef(db, `clipboard/tabs-meta/${id}`)); remove(dbRef(db, `clipboard/tabs-content/${id}`)); }
                };
                tabEl.appendChild(nameSpan); tabEl.appendChild(delBtn);
                tabEl.onclick = () => { if (activeTabId !== id) { activeTabId = id; localStorage.setItem('activeTabId', id); renderTabs(); subscribeToActiveTab(); } };
                container.appendChild(tabEl);
            });
            const addBtn = document.createElement('button'); addBtn.className = 'add-tab-btn'; addBtn.innerText = '+';
            addBtn.onclick = () => {
                const name = prompt("Enter tab name:", "New Tab");
                if (name) {
                    const newRef = push(dbRef(db, 'clipboard/tabs-meta'));
                    set(newRef, { name: encryptText(name.trim()) });
                    activeTabId = newRef.key; localStorage.setItem('activeTabId', activeTabId);
                }
            };
            container.appendChild(addBtn);
        }

        function decryptAndDisplayContent(raw) {
            const decrypted = decryptText(raw);
            editor.innerHTML = decrypted;
            if (decrypted.startsWith("🔒")) { editor.setAttribute("contenteditable", "false"); editor.style.opacity = "0.5"; }
            else { editor.setAttribute("contenteditable", "true"); editor.style.opacity = "1"; }
            if (editor.innerHTML.trim() === '' || editor.innerHTML === '<br>') editor.setAttribute('empty', ''); else editor.removeAttribute('empty');
        }

        function subscribeToActiveTab() {
            if (!activeTabId) return;
            if (unsubContent) unsubContent();
            editor.innerHTML = "";
            unsubContent = onValue(dbRef(db, `clipboard/tabs-content/${activeTabId}`), (snapshot) => {
                if (!isLocalChange) { rawContentSnapshot = snapshot.val() || ""; decryptAndDisplayContent(rawContentSnapshot); }
            });
        }

        function triggerSync() {
            if (!activeTabId || editor.getAttribute("contenteditable") === "false") return;
            isLocalChange = true;
            if (editor.innerHTML.trim() === '' || editor.innerHTML === '<br>') editor.setAttribute('empty', ''); else editor.removeAttribute('empty');
            set(dbRef(db, `clipboard/tabs-content/${activeTabId}`), encryptText(editor.innerHTML)).then(() => { isLocalChange = false; }).catch(() => { isLocalChange = false; });
        }
        editor.addEventListener('input', triggerSync);
        
        // Handle Image Paste (from Snipping Tool, etc.)
        editor.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) { 
                        document.execCommand('insertImage', false, event.target.result); 
                        triggerSync(); 
                    };
                    reader.readAsDataURL(blob); 
                    e.preventDefault(); 
                    return;
                }
            }
        });

        // Copy button
        document.getElementById('copy-btn').addEventListener('click', async () => {
            if (editor.getAttribute("contenteditable") === "false") return alert("Cannot copy locked data.");
            try {
                await navigator.clipboard.write([new ClipboardItem({'text/plain': new Blob([editor.innerText], {type: 'text/plain'}), 'text/html': new Blob([editor.innerHTML], {type: 'text/html'})})]);
                const btn = document.getElementById('copy-btn'); const orig = btn.innerText; btn.innerText = "Copied!"; setTimeout(() => btn.innerText = orig, 2000);
            } catch (err) {
                try {
                    await navigator.clipboard.writeText(editor.innerText);
                    const btn = document.getElementById('copy-btn'); const orig = btn.innerText; btn.innerText = "Copied (Text Only)!"; setTimeout(() => btn.innerText = orig, 2000);
                } catch(e) {}
            }
        });

        updateUIState();
        if (currentPin) updatePresence();

    </script>
</body>
</html>
