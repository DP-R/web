<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Clipboard Tabs</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 15px 20px;
            background-color: #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 1.2rem; color: #fff; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        #status { font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .indicator { width: 10px; height: 10px; border-radius: 50%; background-color: #f44336; }
        .indicator.online { background-color: #4caf50; }
        button.btn-main {
            background: #4caf50; color: white; border: none; padding: 8px 16px;
            border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: background 0.2s;
        }
        button.btn-main:hover { background: #45a049; }
        
        /* Tabs Bar */
        .tabs-container {
            display: flex;
            background-color: #252525;
            border-bottom: 1px solid #3d3d3d;
            padding: 0 10px;
            overflow-x: auto;
        }
        .tabs-container::-webkit-scrollbar { height: 4px; }
        .tabs-container::-webkit-scrollbar-thumb { background: #4a4a4a; }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: #a0a0a0;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }
        .tab:hover { color: #fff; }
        .tab.active {
            color: #4caf50;
            border-bottom: 2px solid #4caf50;
            background-color: #ffffff; /* Match editor background */
            color: #1e1e1e;
        }
        .tab-delete {
            font-size: 1.3rem;
            line-height: 1;
            padding: 0 4px;
            border-radius: 50%;
            display: none;
        }
        .tab.active .tab-delete { display: inline-block; color: #888; }
        .tab-delete:hover { color: #ff5555 !important; }
        
        .add-tab-btn {
            background: transparent;
            color: #a0a0a0;
            font-size: 1.5rem;
            padding: 5px 15px;
            border: none;
            cursor: pointer;
        }
        .add-tab-btn:hover { color: #fff; }

        /* Rich Text Editor */
        .editor {
            flex: 1; width: 100%; box-sizing: border-box;
            background-color: #ffffff; /* White background for Excel/Word compatibility */
            color: #000000; border: none;
            padding: 20px; font-size: 1.1rem; outline: none;
            overflow-y: auto;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .editor[empty]:before {
            content: attr(placeholder);
            color: #888;
            pointer-events: none;
            display: block; /* For Firefox */
        }
        
        /* Basic table borders if not provided by paste */
        .editor table { border-collapse: collapse; }
        .editor td, .editor th { border: 1px solid #ccc; padding: 4px 8px; }
        .editor img { max-width: 100%; height: auto; }
    </style>
</head>
<body>

    <header>
        <h1>Live Clipboard</h1>
        <div class="header-right">
            <div id="status">
                <div id="indicator" class="indicator"></div>
                <span id="status-text">Disconnected</span>
            </div>
            <button class="btn-main" id="copy-btn">Copy to Clipboard</button>
        </div>
    </header>

    <div class="tabs-container" id="tabs-container">
        <!-- Tabs injected dynamically -->
    </div>

    <!-- contenteditable div instead of textarea to support rich text/images -->
    <div id="clipboard" class="editor" contenteditable="true" placeholder="Paste formatted text (Word/Excel) or images here to sync..."></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBJ9y1yA231l5DBpHdQJUsxdkYHlM_lPE",
            authDomain: "my-clipboard-b96fc.firebaseapp.com",
            databaseURL: "https://my-clipboard-b96fc-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "my-clipboard-b96fc",
            storageBucket: "my-clipboard-b96fc.firebasestorage.app",
            messagingSenderId: "599514202906",
            appId: "1:599514202906:web:538098a893cd0c9431e2a3",
            measurementId: "G-RX1Z0RHGZR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const tabsMetaRef = ref(db, 'clipboard/tabs-meta');
        const connectedRef = ref(db, '.info/connected');

        const editor = document.getElementById('clipboard');
        const indicator = document.getElementById('indicator');
        const statusText = document.getElementById('status-text');
        const copyBtn = document.getElementById('copy-btn');
        const tabsContainer = document.getElementById('tabs-container');

        let isLocalChange = false;
        let activeTabId = localStorage.getItem('activeTabId') || null;
        let unsubContent = null;
        let tabsData = {};

        // Handle placeholder logic for contenteditable
        function updatePlaceholder() {
            if (editor.innerHTML.trim() === '' || editor.innerHTML === '<br>') {
                editor.setAttribute('empty', '');
            } else {
                editor.removeAttribute('empty');
            }
        }
        editor.addEventListener('input', updatePlaceholder);

        // Monitor connection
        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                indicator.classList.add('online');
                statusText.innerText = "Online & Synced";
            } else {
                indicator.classList.remove('online');
                statusText.innerText = "Disconnected";
            }
        });

        // Fetch Tab Metadata
        onValue(tabsMetaRef, (snapshot) => {
            tabsData = snapshot.val() || {};
            
            if (Object.keys(tabsData).length === 0) {
                const defaultId = "tab_default";
                set(ref(db, `clipboard/tabs-meta/${defaultId}`), { name: "Main" });
                return;
            }

            if (!activeTabId || !tabsData[activeTabId]) {
                activeTabId = Object.keys(tabsData)[0];
            }

            renderTabs();
            subscribeToActiveTab();
        });

        function renderTabs() {
            tabsContainer.innerHTML = '';
            
            Object.entries(tabsData).forEach(([id, meta]) => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${id === activeTabId ? 'active' : ''}`;
                
                const nameSpan = document.createElement('span');
                nameSpan.innerText = meta.name;
                nameSpan.title = "Double click to rename";
                nameSpan.ondblclick = (e) => {
                    e.stopPropagation();
                    const newName = prompt("Enter new tab name:", meta.name);
                    if (newName && newName.trim() !== "") {
                        set(ref(db, `clipboard/tabs-meta/${id}/name`), newName.trim());
                    }
                };
                
                const delBtn = document.createElement('span');
                delBtn.className = 'tab-delete';
                delBtn.innerHTML = '&times;';
                delBtn.title = "Delete tab";
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (Object.keys(tabsData).length === 1) {
                        alert("Cannot delete the last tab.");
                        return;
                    }
                    if (confirm(`Delete tab "${meta.name}"?`)) {
                        remove(ref(db, `clipboard/tabs-meta/${id}`));
                        remove(ref(db, `clipboard/tabs-content/${id}`));
                    }
                };

                tabEl.appendChild(nameSpan);
                tabEl.appendChild(delBtn);
                
                tabEl.onclick = () => {
                    if (activeTabId !== id) {
                        activeTabId = id;
                        localStorage.setItem('activeTabId', id);
                        renderTabs();
                        subscribeToActiveTab();
                    }
                };
                
                tabsContainer.appendChild(tabEl);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'add-tab-btn';
            addBtn.innerText = '+';
            addBtn.title = "New Tab";
            addBtn.onclick = () => {
                const name = prompt("Enter tab name:", "New Tab");
                if (name && name.trim() !== "") {
                    const newRef = push(tabsMetaRef);
                    set(newRef, { name: name.trim() });
                    activeTabId = newRef.key;
                    localStorage.setItem('activeTabId', activeTabId);
                }
            };
            tabsContainer.appendChild(addBtn);
        }

        function subscribeToActiveTab() {
            if (!activeTabId) return;
            
            if (unsubContent) unsubContent();
            
            editor.innerHTML = "";
            editor.setAttribute('placeholder', 'Loading...');
            updatePlaceholder();
            
            const contentRef = ref(db, `clipboard/tabs-content/${activeTabId}`);
            unsubContent = onValue(contentRef, (snapshot) => {
                if (!isLocalChange) {
                    editor.innerHTML = snapshot.val() || "";
                    editor.setAttribute('placeholder', 'Paste formatted text (Word/Excel) or images here to sync...');
                    updatePlaceholder();
                }
            });
        }

        // Push text/html changes
        editor.addEventListener('input', (e) => {
            if (!activeTabId) return;
            isLocalChange = true;
            
            set(ref(db, `clipboard/tabs-content/${activeTabId}`), editor.innerHTML)
                .then(() => { isLocalChange = false; })
                .catch(err => { console.error(err); isLocalChange = false; });
        });
        
        // Custom Paste handler to intercept native image files pasted from clipboard
        editor.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    // It's an image file! Read it as base64 and insert it properly.
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const base64 = event.target.result;
                        // Insert the image into the editor
                        document.execCommand('insertImage', false, base64);
                    };
                    reader.readAsDataURL(blob);
                    e.preventDefault(); // Stop default blob pasting
                    return;
                }
            }
            // For Excel/Word/Text, let the browser handle it naturally so it preserves HTML!
        });

        // Copy button: Writes BOTH Rich Text and Plain Text to your OS clipboard
        copyBtn.addEventListener('click', async () => {
            try {
                const html = editor.innerHTML;
                const plainText = editor.innerText;

                // Create blobs for clipboard API
                const clipboardItem = new ClipboardItem({
                    'text/plain': new Blob([plainText], { type: 'text/plain' }),
                    'text/html': new Blob([html], { type: 'text/html' })
                });
                
                await navigator.clipboard.write([clipboardItem]);

                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copied!";
                setTimeout(() => copyBtn.innerText = originalText, 2000);
            } catch (err) {
                console.error("Rich text copy failed, falling back to plain text", err);
                try {
                    await navigator.clipboard.writeText(editor.innerText);
                    const originalText = copyBtn.innerText;
                    copyBtn.innerText = "Copied (Text Only)!";
                    setTimeout(() => copyBtn.innerText = originalText, 2000);
                } catch(e) {
                    alert("Failed to copy");
                }
            }
        });
    </script>
</body>
</html>
