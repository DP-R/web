<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Clipboard Tabs</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 15px 20px;
            background-color: #2d2d2d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 1.2rem; color: #fff; }
        .header-right { display: flex; align-items: center; gap: 20px; }
        #status { font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .indicator { width: 10px; height: 10px; border-radius: 50%; background-color: #f44336; }
        .indicator.online { background-color: #4caf50; }
        button.btn-main {
            background: #4caf50; color: white; border: none; padding: 8px 16px;
            border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: background 0.2s;
        }
        button.btn-main:hover { background: #45a049; }
        
        /* Tabs Bar */
        .tabs-container {
            display: flex;
            background-color: #252525;
            border-bottom: 1px solid #3d3d3d;
            padding: 0 10px;
            overflow-x: auto;
        }
        .tabs-container::-webkit-scrollbar { height: 4px; }
        .tabs-container::-webkit-scrollbar-thumb { background: #4a4a4a; }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            color: #a0a0a0;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }
        .tab:hover { color: #fff; }
        .tab.active {
            color: #4caf50;
            border-bottom: 2px solid #4caf50;
            background-color: #1e1e1e;
        }
        .tab-delete {
            font-size: 1.3rem;
            line-height: 1;
            padding: 0 4px;
            border-radius: 50%;
            display: none;
        }
        .tab.active .tab-delete { display: inline-block; }
        .tab-delete:hover { color: #ff5555; }
        
        .add-tab-btn {
            background: transparent;
            color: #a0a0a0;
            font-size: 1.5rem;
            padding: 5px 15px;
            border: none;
            cursor: pointer;
        }
        .add-tab-btn:hover { color: #fff; }

        textarea {
            flex: 1; width: 100%; box-sizing: border-box;
            background-color: #1e1e1e; color: #d4d4d4; border: none;
            padding: 20px; font-size: 1.1rem; resize: none; outline: none;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

    <header>
        <h1>Live Clipboard</h1>
        <div class="header-right">
            <div id="status">
                <div id="indicator" class="indicator"></div>
                <span id="status-text">Disconnected</span>
            </div>
            <button class="btn-main" id="copy-btn">Copy to Clipboard</button>
        </div>
    </header>

    <div class="tabs-container" id="tabs-container">
        <!-- Tabs injected dynamically -->
    </div>

    <textarea id="clipboard" placeholder="Paste or type text here to sync across devices..." autofocus></textarea>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBJ9y1yA231l5DBpHdQJUsxdkYHlM_lPE",
            authDomain: "my-clipboard-b96fc.firebaseapp.com",
            databaseURL: "https://my-clipboard-b96fc-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "my-clipboard-b96fc",
            storageBucket: "my-clipboard-b96fc.firebasestorage.app",
            messagingSenderId: "599514202906",
            appId: "1:599514202906:web:538098a893cd0c9431e2a3",
            measurementId: "G-RX1Z0RHGZR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const tabsMetaRef = ref(db, 'clipboard/tabs-meta');
        const connectedRef = ref(db, '.info/connected');

        const textarea = document.getElementById('clipboard');
        const indicator = document.getElementById('indicator');
        const statusText = document.getElementById('status-text');
        const copyBtn = document.getElementById('copy-btn');
        const tabsContainer = document.getElementById('tabs-container');

        let isLocalChange = false;
        let activeTabId = localStorage.getItem('activeTabId') || null;
        let unsubContent = null;
        let tabsData = {};

        // Monitor connection
        onValue(connectedRef, (snap) => {
            if (snap.val() === true) {
                indicator.classList.add('online');
                statusText.innerText = "Online & Synced";
            } else {
                indicator.classList.remove('online');
                statusText.innerText = "Disconnected";
            }
        });

        // Fetch Tab Metadata
        onValue(tabsMetaRef, (snapshot) => {
            tabsData = snapshot.val() || {};
            
            // Auto-create default tab if the entire object was deleted
            if (Object.keys(tabsData).length === 0) {
                const defaultId = "tab_default";
                set(ref(db, `clipboard/tabs-meta/${defaultId}`), { name: "Main" });
                return;
            }

            // Ensure active tab exists (in case someone deleted it from another device)
            if (!activeTabId || !tabsData[activeTabId]) {
                activeTabId = Object.keys(tabsData)[0];
            }

            renderTabs();
            subscribeToActiveTab();
        });

        function renderTabs() {
            tabsContainer.innerHTML = '';
            
            Object.entries(tabsData).forEach(([id, meta]) => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${id === activeTabId ? 'active' : ''}`;
                
                const nameSpan = document.createElement('span');
                nameSpan.innerText = meta.name;
                nameSpan.title = "Double click to rename";
                nameSpan.ondblclick = (e) => {
                    e.stopPropagation();
                    const newName = prompt("Enter new tab name:", meta.name);
                    if (newName && newName.trim() !== "") {
                        set(ref(db, `clipboard/tabs-meta/${id}/name`), newName.trim());
                    }
                };
                
                const delBtn = document.createElement('span');
                delBtn.className = 'tab-delete';
                delBtn.innerHTML = '&times;';
                delBtn.title = "Delete tab";
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (Object.keys(tabsData).length === 1) {
                        alert("Cannot delete the last tab.");
                        return;
                    }
                    if (confirm(`Delete tab "${meta.name}"?`)) {
                        remove(ref(db, `clipboard/tabs-meta/${id}`));
                        remove(ref(db, `clipboard/tabs-content/${id}`));
                    }
                };

                tabEl.appendChild(nameSpan);
                tabEl.appendChild(delBtn);
                
                // Click to switch
                tabEl.onclick = () => {
                    if (activeTabId !== id) {
                        activeTabId = id;
                        localStorage.setItem('activeTabId', id);
                        renderTabs();
                        subscribeToActiveTab();
                    }
                };
                
                tabsContainer.appendChild(tabEl);
            });

            // Add Tab Button
            const addBtn = document.createElement('button');
            addBtn.className = 'add-tab-btn';
            addBtn.innerText = '+';
            addBtn.title = "New Tab";
            addBtn.onclick = () => {
                const name = prompt("Enter tab name:", "New Tab");
                if (name && name.trim() !== "") {
                    const newRef = push(tabsMetaRef);
                    set(newRef, { name: name.trim() });
                    activeTabId = newRef.key;
                    localStorage.setItem('activeTabId', activeTabId);
                }
            };
            tabsContainer.appendChild(addBtn);
        }

        function subscribeToActiveTab() {
            if (!activeTabId) return;
            
            // Clean up old listener when switching tabs
            if (unsubContent) unsubContent();
            
            textarea.value = ""; // clear momentarily
            textarea.placeholder = "Loading...";
            
            const contentRef = ref(db, `clipboard/tabs-content/${activeTabId}`);
            unsubContent = onValue(contentRef, (snapshot) => {
                if (!isLocalChange) {
                    textarea.value = snapshot.val() || "";
                    textarea.placeholder = "Paste or type text here to sync across devices...";
                }
            });
        }

        // Push text changes
        textarea.addEventListener('input', (e) => {
            if (!activeTabId) return;
            isLocalChange = true;
            set(ref(db, `clipboard/tabs-content/${activeTabId}`), e.target.value)
                .then(() => { isLocalChange = false; })
                .catch(err => { console.error(err); isLocalChange = false; });
        });

        // Copy button
        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(textarea.value);
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copied!";
                setTimeout(() => copyBtn.innerText = originalText, 2000);
            } catch (err) {
                alert("Failed to copy");
            }
        });
    </script>
</body>
</html>
