<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Clipboard Tabs</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #1e1e1e; color: #d4d4d4; font-family: system-ui, sans-serif; display: flex; flex-direction: column; }
        header { padding: 15px 20px; background-color: #2d2d2d; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; color: #fff; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        
        .pin-input { background: #1e1e1e; color: #4caf50; border: 1px solid #4caf50; padding: 6px 10px; border-radius: 4px; width: 80px; outline: none; transition: width 0.3s; }
        .pin-input:focus { width: 120px; background: #fff; color: #000; }
        
        #status { display: flex; align-items: center; gap: 8px; }
        .indicator { width: 10px; height: 10px; border-radius: 50%; background-color: #f44336; }
        .indicator.online { background-color: #4caf50; }
        
        button.btn-main { background: #4caf50; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        button.btn-main:hover { background: #45a049; }
        button.btn-icon { background: #3d3d3d; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 1.1rem; }
        button.btn-icon:hover { background: #555; }
        
        .tabs-container { display: flex; background-color: #252525; border-bottom: 1px solid #3d3d3d; padding: 0 10px; overflow-x: auto; }
        .tabs-container::-webkit-scrollbar { height: 4px; }
        .tabs-container::-webkit-scrollbar-thumb { background: #4a4a4a; }
        .tab { padding: 12px 20px; cursor: pointer; border-bottom: 2px solid transparent; color: #a0a0a0; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        .tab:hover { color: #fff; }
        .tab.active { border-bottom: 2px solid #4caf50; background-color: #000000; color: #d4d4d4; }
        .tab-delete { font-size: 1.3rem; line-height: 1; padding: 0 4px; border-radius: 50%; display: none; }
        .tab.active .tab-delete { display: inline-block; color: #888; }
        .tab-delete:hover { color: #ff5555 !important; }
        .add-tab-btn { background: transparent; color: #a0a0a0; font-size: 1.5rem; padding: 5px 15px; border: none; cursor: pointer; }
        
        .editor { flex: 1; width: 100%; box-sizing: border-box; background-color: #ffffff; color: #000000; border: none; padding: 20px; font-size: 1.1rem; outline: none; overflow-y: auto; filter: invert(1) hue-rotate(180deg); }
        .editor[empty]:before { content: attr(placeholder); color: #888; pointer-events: none; display: block; }
        .editor table { border-collapse: collapse; }
        .editor td, .editor th { border: 1px solid #ccc; padding: 4px 8px; }
        .editor img { max-width: 100%; height: auto; filter: invert(1) hue-rotate(180deg); }

        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: #2d2d2d; padding: 25px; border-radius: 8px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal h2 { margin-top: 0; }
        .device-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #1e1e1e; margin-bottom: 8px; border-radius: 4px; font-size: 0.95rem; }
        .btn-danger { background: #f44336; padding: 6px 12px; }
        .btn-danger:hover { background: #d32f2f; }
    </style>
</head>
<body>

    <header>
        <h1>Live Clipboard</h1>
        <div class="header-right">
            <button class="btn-main" id="request-btn" style="background: #2196F3; display: none;">🔔 Request Access</button>
            <label style="font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 4px;" id="remember-wrapper">
                <input type="checkbox" id="remember-me"> Save PIN
            </label>
            <input type="password" id="pin-input" class="pin-input" placeholder="Manual PIN" title="Enter PIN">
            <button class="btn-icon" id="devices-btn" title="Manage Active Devices">💻</button>
            <div id="status"><div id="indicator" class="indicator"></div></div>
            <button class="btn-main" id="copy-btn">Copy</button>
        </div>
    </header>

    <div class="tabs-container" id="tabs-container"></div>
    <div id="clipboard" class="editor" contenteditable="true" placeholder="Paste formatted text or images here..."></div>

    <!-- Modals -->
    <div class="modal-overlay" id="devices-modal">
        <div class="modal">
            <h2>Active Devices</h2>
            <p style="color: #a0a0a0; font-size: 0.9rem;">Devices currently connected with your PIN.</p>
            <div id="devices-list" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;"></div>
            <button class="btn-main" onclick="document.getElementById('devices-modal').classList.remove('active')">Close</button>
        </div>
    </div>

    <div class="modal-overlay" id="approve-modal">
        <div class="modal">
            <h2>Approve Login?</h2>
            <p id="approve-text">Another computer is trying to log in.</p>
            <button class="btn-main" id="approve-btn" style="width: 100%; margin-bottom: 10px;">Approve Access</button>
            <button class="btn-main" id="deny-btn" style="width: 100%; background: #555;">Deny</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, push, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBJ9y1yA231l5DBpHdQJUsxdkYHlM_lPE",
            authDomain: "my-clipboard-b96fc.firebaseapp.com",
            databaseURL: "https://my-clipboard-b96fc-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "my-clipboard-b96fc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let myDeviceId = localStorage.getItem('clip_device_id');
        if (!myDeviceId) { myDeviceId = "dev_" + Math.random().toString(36).substr(2, 9); localStorage.setItem('clip_device_id', myDeviceId); }

        const editor = document.getElementById('clipboard');
        const pinInput = document.getElementById('pin-input');
        const rememberCheckbox = document.getElementById('remember-me');
        const requestBtn = document.getElementById('request-btn');
        const myDeviceRef = ref(db, `clipboard/active-devices/${myDeviceId}`);
        
        let isLocalChange = false;
        let activeTabId = localStorage.getItem('activeTabId') || null;
        let unsubContent = null;
        let tabsData = {};
        let rawContentSnapshot = "";

        // --- AUTH & PERSISTENCE ---
        rememberCheckbox.checked = localStorage.getItem('clip_remember') === 'true';
        rememberCheckbox.addEventListener('change', (e) => {
            localStorage.setItem('clip_remember', e.target.checked);
            savePin(pinInput.value);
        });

        const savedPin = localStorage.getItem('clip_pin') || sessionStorage.getItem('clip_pin');
        if (savedPin) pinInput.value = savedPin;

        function savePin(pin) {
            if (!pin) { localStorage.removeItem('clip_pin'); sessionStorage.removeItem('clip_pin'); return; }
            if (rememberCheckbox.checked) {
                localStorage.setItem('clip_pin', pin); sessionStorage.removeItem('clip_pin');
            } else {
                sessionStorage.setItem('clip_pin', pin); localStorage.removeItem('clip_pin');
            }
        }

        function getDeviceName() {
            const ua = navigator.userAgent;
            if (ua.includes("Windows")) return "Windows PC";
            if (ua.includes("Mac")) return "Mac";
            if (ua.includes("iPhone")) return "iPhone";
            if (ua.includes("Android")) return "Android";
            return "Unknown Browser";
        }

        function updatePresence() {
            if (pinInput.value) {
                set(myDeviceRef, { name: getDeviceName(), time: Date.now() });
                onDisconnect(myDeviceRef).remove();
            } else {
                remove(myDeviceRef);
            }
        }

        function updateUIState() {
            if (pinInput.value) {
                requestBtn.style.display = 'none';
            } else {
                requestBtn.style.display = 'block';
            }
        }
        updateUIState();

        pinInput.addEventListener('input', (e) => {
            updateUIState();
            savePin(e.target.value);
            updatePresence();
            renderTabs(); 
            decryptAndDisplayContent(rawContentSnapshot);
        });

        // Remote Revocation
        onValue(myDeviceRef, (snap) => {
            if (!snap.exists() && pinInput.value) {
                pinInput.value = ""; savePin(""); 
                document.body.innerHTML = "<h1 style='text-align:center; margin-top:20%; color:#f44336;'>Session Revoked.</h1>";
                setTimeout(() => window.location.reload(), 2000);
            }
        });

        if (pinInput.value) updatePresence();

        // --- GLOBAL BROADCAST REQUEST (No QR) ---
        // 1. Requester Flow (Public PC)
        requestBtn.onclick = () => {
            const tempId = "req_" + Math.random().toString(36).substr(2, 9);
            const reqRef = ref(db, `clipboard/global-requests/${tempId}`);
            
            set(reqRef, { name: getDeviceName(), status: 'pending' });
            onDisconnect(reqRef).remove(); // Auto-cancel if user closes tab
            
            requestBtn.innerText = "⏳ Waiting for phone...";
            requestBtn.style.background = "#ff9800";
            
            onValue(reqRef, (snap) => {
                const data = snap.val();
                if (data && data.pin) {
                    // Approved!
                    pinInput.value = data.pin;
                    rememberCheckbox.checked = false; // Force session storage for remote access!
                    savePin(data.pin); 
                    updatePresence(); renderTabs(); decryptAndDisplayContent(rawContentSnapshot);
                    remove(reqRef); // Cleanup
                    updateUIState();
                } else if (!data && requestBtn.innerText.includes("Waiting")) {
                    // Denied
                    requestBtn.innerText = "❌ Denied";
                    requestBtn.style.background = "#f44336";
                    setTimeout(() => { requestBtn.innerText = "🔔 Request Access"; requestBtn.style.background = "#2196F3"; }, 3000);
                }
            });
        };

        // 2. Approver Flow (Phone)
        const globalReqRef = ref(db, 'clipboard/global-requests');
        onValue(globalReqRef, (snap) => {
            if (!pinInput.value) return; // Cannot approve if we are not logged in ourselves
            const reqs = snap.val() || {};
            
            const pendingKey = Object.keys(reqs).find(k => reqs[k].status === 'pending');
            if (pendingKey) {
                const req = reqs[pendingKey];
                document.getElementById('approve-text').innerText = `"${req.name}" is requesting access to your clipboard.`;
                document.getElementById('approve-modal').classList.add('active');
                
                document.getElementById('approve-btn').onclick = () => {
                    set(ref(db, `clipboard/global-requests/${pendingKey}/pin`), pinInput.value);
                    document.getElementById('approve-modal').classList.remove('active');
                };
                
                document.getElementById('deny-btn').onclick = () => {
                    remove(ref(db, `clipboard/global-requests/${pendingKey}`));
                    document.getElementById('approve-modal').classList.remove('active');
                };
            }
        });


        // --- ACTIVE DEVICES MANAGER ---
        document.getElementById('devices-btn').onclick = () => {
            document.getElementById('devices-modal').classList.add('active');
            onValue(ref(db, 'clipboard/active-devices'), (snap) => {
                const list = document.getElementById('devices-list');
                list.innerHTML = "";
                const devices = snap.val() || {};
                Object.entries(devices).forEach(([id, data]) => {
                    const div = document.createElement('div'); div.className = "device-item";
                    div.innerHTML = `<span>${data.name} ${id === myDeviceId ? "(You)" : ""}</span>`;
                    if (id !== myDeviceId) {
                        const btn = document.createElement('button'); btn.className = "btn-main btn-danger"; btn.innerText = "Revoke";
                        btn.onclick = () => remove(ref(db, `clipboard/active-devices/${id}`));
                        div.appendChild(btn);
                    }
                    list.appendChild(div);
                });
            });
        };

        // --- ENCRYPTION & TABS LOGIC ---
        function encryptText(text) {
            const pin = pinInput.value;
            if (!pin) return text;
            try { return "ENC:" + CryptoJS.AES.encrypt(text, pin).toString(); } catch(e) { return text; }
        }
        function decryptText(text) {
            if (!text || typeof text !== 'string' || !text.startsWith("ENC:")) return text;
            const pin = pinInput.value;
            if (!pin) return "🔒 [Encrypted - Enter PIN to view]";
            try { return CryptoJS.AES.decrypt(text.slice(4), pin).toString(CryptoJS.enc.Utf8) || "🔒 [Wrong PIN]"; } catch (e) { return "🔒 [Wrong PIN]"; }
        }

        onValue(ref(db, '.info/connected'), (snap) => {
            if (snap.val() === true) document.getElementById('indicator').classList.add('online');
            else document.getElementById('indicator').classList.remove('online');
        });

        onValue(ref(db, 'clipboard/tabs-meta'), (snapshot) => {
            tabsData = snapshot.val() || {};
            if (Object.keys(tabsData).length === 0) {
                set(ref(db, `clipboard/tabs-meta/tab_default`), { name: encryptText("Main") }); return;
            }
            if (!activeTabId || !tabsData[activeTabId]) activeTabId = Object.keys(tabsData)[0];
            renderTabs(); subscribeToActiveTab();
        });

        function renderTabs() {
            const container = document.getElementById('tabs-container'); container.innerHTML = '';
            Object.entries(tabsData).forEach(([id, meta]) => {
                const tabEl = document.createElement('div'); tabEl.className = `tab ${id === activeTabId ? 'active' : ''}`;
                const decryptedName = decryptText(meta.name);
                
                const nameSpan = document.createElement('span'); nameSpan.innerText = decryptedName;
                nameSpan.ondblclick = (e) => {
                    e.stopPropagation(); if (decryptedName.startsWith("🔒")) return;
                    const newName = prompt("New tab name:", decryptedName);
                    if (newName) set(ref(db, `clipboard/tabs-meta/${id}/name`), encryptText(newName.trim()));
                };
                
                const delBtn = document.createElement('span'); delBtn.className = 'tab-delete'; delBtn.innerHTML = '&times;';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (Object.keys(tabsData).length === 1) return alert("Cannot delete last tab.");
                    if (confirm(`Delete tab "${decryptedName}"?`)) {
                        remove(ref(db, `clipboard/tabs-meta/${id}`)); remove(ref(db, `clipboard/tabs-content/${id}`));
                    }
                };

                tabEl.appendChild(nameSpan); tabEl.appendChild(delBtn);
                tabEl.onclick = () => {
                    if (activeTabId !== id) { activeTabId = id; localStorage.setItem('activeTabId', id); renderTabs(); subscribeToActiveTab(); }
                };
                container.appendChild(tabEl);
            });
            const addBtn = document.createElement('button'); addBtn.className = 'add-tab-btn'; addBtn.innerText = '+';
            addBtn.onclick = () => {
                const name = prompt("Enter tab name:", "New Tab");
                if (name) {
                    const newRef = push(ref(db, 'clipboard/tabs-meta'));
                    set(newRef, { name: encryptText(name.trim()) });
                    activeTabId = newRef.key; localStorage.setItem('activeTabId', activeTabId);
                }
            };
            container.appendChild(addBtn);
        }

        function decryptAndDisplayContent(raw) {
            const decrypted = decryptText(raw);
            editor.innerHTML = decrypted;
            if (decrypted.startsWith("🔒")) { editor.setAttribute("contenteditable", "false"); editor.style.opacity = "0.5"; }
            else { editor.setAttribute("contenteditable", "true"); editor.style.opacity = "1"; }
            if (editor.innerHTML.trim() === '' || editor.innerHTML === '<br>') editor.setAttribute('empty', '');
            else editor.removeAttribute('empty');
        }

        function subscribeToActiveTab() {
            if (!activeTabId) return;
            if (unsubContent) unsubContent();
            editor.innerHTML = "";
            unsubContent = onValue(ref(db, `clipboard/tabs-content/${activeTabId}`), (snapshot) => {
                if (!isLocalChange) { rawContentSnapshot = snapshot.val() || ""; decryptAndDisplayContent(rawContentSnapshot); }
            });
        }

        editor.addEventListener('input', (e) => {
            if (!activeTabId || editor.getAttribute("contenteditable") === "false") return;
            isLocalChange = true;
            if (editor.innerHTML.trim() === '' || editor.innerHTML === '<br>') editor.setAttribute('empty', '');
            else editor.removeAttribute('empty');
            set(ref(db, `clipboard/tabs-content/${activeTabId}`), encryptText(editor.innerHTML))
                .then(() => { isLocalChange = false; }).catch(err => { isLocalChange = false; });
        });
        
        editor.addEventListener('paste', (e) => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) { document.execCommand('insertImage', false, event.target.result); };
                    reader.readAsDataURL(blob); e.preventDefault(); return;
                }
            }
        });

        document.getElementById('copy-btn').addEventListener('click', async () => {
            if (editor.getAttribute("contenteditable") === "false") return alert("Cannot copy locked data.");
            try {
                await navigator.clipboard.write([new ClipboardItem({'text/plain': new Blob([editor.innerText], {type: 'text/plain'}), 'text/html': new Blob([editor.innerHTML], {type: 'text/html'})})]);
                const btn = document.getElementById('copy-btn'); const orig = btn.innerText; btn.innerText = "Copied!"; setTimeout(() => btn.innerText = orig, 2000);
            } catch (err) {
                try {
                    await navigator.clipboard.writeText(editor.innerText);
                    const btn = document.getElementById('copy-btn'); const orig = btn.innerText; btn.innerText = "Copied (Text Only)!"; setTimeout(() => btn.innerText = orig, 2000);
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
